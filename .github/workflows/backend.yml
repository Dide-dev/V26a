name: Backend Rust CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ht_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ht_ci
      LISTENING_IP: localhost
      LISTENING_PORT: 3000
      RUST_LOG: INFO
      JWT_SECRET: secret
      SESSION_EXPIRATION_SECONDS: 604800
      BASE_URL: http://localhost
      SMTP_SERVER: localhost

      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings

    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        # Version must be kept in sync with /backend/rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      #     https://github.com/actions/cache/blob/main/examples.md#rust---cargo
      #     This seems to be ignoring the working-directory flag above.. Having added the "backend/" made building faster
      - name: Cache Rust artifacts for faster CI
        id: cache-cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache SQLx installation
        id: cache-sqlx
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/
          key: ${{ runner.os }}-cargo-sqlx
          # this means sqlx will never update on CI, but because we don't update it either, this shouldn't be a problem.
      - name: Format
        run: cargo fmt --check
      - name: Install sqlx-cli
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres --locked --force
      - name: Run database migrations
        run: cargo sqlx migrate run
      - name: Check offline SQLx queries
        run: cargo sqlx prepare --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Run tests
        run: cargo test
      - name: Check documentation
        run: cargo doc --no-deps
