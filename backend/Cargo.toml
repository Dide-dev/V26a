[package]
name = "ht-backend"
version = "1.0.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["ws"] }
axum-extra = { version = "0.12", features = [
    "typed-header",
    "cookie",
    "query",
] }
bcrypt = "0.19"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
governor = "0.10"
infer = "0.19"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
percent-encoding = "2.3"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = [
    "migrate",
    "json",
    "runtime-tokio",
    "postgres",
    "chrono",
    "macros",
] }
time = "0.3"
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread"] }
tower_governor = { version = "0.8", features = ["axum"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5.5", features = ["chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
utoipauto = "0.2"
tower = "0.5"
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
axum-test = { version = "20.1", features = ["ws"] }
tempfile = "3.27"
