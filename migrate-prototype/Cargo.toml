[package]
name = "migrate-prototype"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "chrono",
    "macros",
    "postgres",
    "mysql",
] }
html-to-markdown-rs = "3.3.3"
reqwest = { version = "0.13.3", features = ["json", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
