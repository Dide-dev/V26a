volumes:
  postgres_dir:
  caddy_data:
  caddy_config:

services:
  db:
    image: docker.io/postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_dir:/var/lib/postgresql

  caddy:
    image: docker.io/caddy:2.11
    restart: unless-stopped
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8000:8000"
    depends_on:
      - backend

  backend:
    build:
      context: backend
      dockerfile: Containerfile
    # Docker sends a SIGTERM and waits grace_period settings.
    # A better way to do this would be to listen to SIGTERM in our backend and initiate a graceful shutdown when the signal gets sent.
    # This feels too out of scope ATM.
    stop_grace_period: 2s
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - RUST_LOG=${RUST_LOG}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_EXPIRATION_SECONDS=${SESSION_EXPIRATION_SECONDS}
    ports:
      - "3000:3000"
    depends_on:
      - db
