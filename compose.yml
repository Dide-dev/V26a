volumes:
  postgres_dir:
  caddy_data:
  caddy_config:

services:
  db:
    image: docker.io/postgres:18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_dir:/var/lib/postgresql
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: docker.io/caddy:2.11
    restart: unless-stopped
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - BASE_URL=${BASE_URL}
    ports:
      - "80:80"
      - "443:443"

  backend:
    build:
      context: backend
      dockerfile: Containerfile
    restart: unless-stopped
    # Docker sends a SIGTERM and waits grace_period settings.
    # A better way to do this would be to listen to SIGTERM in our backend and initiate a graceful shutdown when the signal gets sent.
    # This feels too out of scope ATM.
    stop_grace_period: 2s
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - RUST_LOG=${RUST_LOG}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_EXPIRATION_SECONDS=${SESSION_EXPIRATION_SECONDS}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: [ "production" ]
    build:
      context: frontend
      dockerfile: Containerfile
      target: prod
    environment:
      NODE_ENV: production
    restart: unless-stopped

  frontend-dev:
    container_name: frontend
    profiles: [ "dev" ]
    build:
      context: frontend
      dockerfile: Containerfile
      target: dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - path: ./frontend
          target: /app
          ignore:
            - '**/*.test.*'
            - '**/tests/**'
          action: sync
          initial_sync: true
        - path: ./frontend/package.json
          action: rebuild
