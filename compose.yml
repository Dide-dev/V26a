volumes:
  postgres_dir:
  caddy_data:
  caddy_config:

services:
  db:
    image: docker.io/postgres:18
    ports:
      - "5432:5432"
    env_file: ".env"
    volumes:
      - postgres_dir:/var/lib/postgresql

  caddy:
    image: docker.io/caddy:2.11
    restart: unless-stopped
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    network_mode: host